<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact MedLeaf Roodepoort | Location Hours</title>
  <meta name="description" content="Contact MedLeaf 45 Van Wyk St Roodepoort open 7am-6pm">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo-text">MedLeaf Coffee Shop</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="enquiry.html">Enquiry</a>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p>45 Van Wyk St, Roodepoort</p>

    <iframe src="https://maps.google.com/maps?q=45 Van Wyk St Roodepoort&t=&z=15&ie=UTF8&iwloc=&output=embed" width="100%" height="350" style="border:0; border-radius:12px; margin:15px 0;" loading="lazy"></iframe>

    <form id="contactForm" novalidate>
      <label>Name<input id="cName" required></label>
      <span class="error" id="eName">Min 2 chars</span>

      <label>Email<input id="cEmail" required></label>
      <span class="error" id="eEmail">Valid email</span>

      <label>Phone<input id="cPhone" placeholder="0XXXXXXXXX" required></label>
      <span class="error" id="ePhone">10 digits</span>

      <label>Type<select id="cType" required><option>General</option><option>Feedback</option></select></label>

      <label>Message<textarea id="cMessage" required></textarea></label>
      <span class="error" id="eMsg">Min 10 chars</span>

      <button type="submit">Send</button>
      <div id="contactSuccess" class="success-box"></div>
    </form>
  </main>

  <footer>© MedLeaf 2026</footer>

  <div id="lightbox"><span>&times;</span><img alt=""></div>

  <script src="js/main.js"></script>
</body>
</html>
